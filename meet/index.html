<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Book a discussion · PSquare Lab</title>
<!--
  PSquare Meet booking page. Static, no secrets. Works only with the full link
  (…/meet/#<access key>) or with a typed access code. Backend: the psquare-meet repo on Vercel.
-->
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #15181d;
    --muted: #5b6270;
    --line: #e2e5ea;
    --chip: #f0f2f5;
    --accent: #1772d0;
    --accent-ink: #ffffff;
    --accent-soft: #e7f0fb;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --ok: #1a7f37;
    --ok-soft: #e8f5ec;
    /* meeting modes: call (green), online (blue), in person (amber) */
    --call: #0f7b4f;
    --call-soft: #e5f4ec;
    --online: #3156c8;
    --online-soft: #eaf0fd;
    --person: #a8570a;
    --person-soft: #fcf0e2;
    --busy: #b4234a;
    --busy-soft: #fde8ee;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a20;
      --text: #e8eaee;
      --muted: #9aa2b1;
      --line: #2a2f38;
      --chip: #20242c;
      --accent: #5aa2f0;
      --accent-ink: #0b1220;
      --accent-soft: #16263a;
      --danger: #f97066;
      --danger-soft: #3a1b1a;
      --ok: #4ac26b;
      --ok-soft: #14291b;
      --call: #4cc38a;
      --call-soft: #11261c;
      --online: #8aa8ff;
      --online-soft: #161f36;
      --person: #f0a75a;
      --person-soft: #2b1e10;
      --busy: #ff7b95;
      --busy-soft: #3a1620;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px calc(40px + env(safe-area-inset-bottom)); }
  header { margin-bottom: 16px; }
  .lab { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 2px 0 0; font-size: 26px; line-height: 1.2; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; margin-top: 14px; }
  .rules { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
  h2 { font-size: 16px; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
  h2:first-child { margin-top: 0; }
  h2 .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 13px; }
  h2 small { font-weight: 400; color: var(--muted); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .opt {
    border: 1px solid var(--line); background: var(--chip); border-radius: 10px; padding: 10px 4px; min-height: 44px;
    transition: background .15s, border-color .15s;
  }
  .opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .opt:disabled { opacity: .4; cursor: not-allowed; }
  .opt:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .k-call { --k: var(--call); --k-soft: var(--call-soft); }
  .k-online { --k: var(--online); --k-soft: var(--online-soft); }
  .k-person { --k: var(--person); --k-soft: var(--person-soft); }
  .calhead { margin: -2px 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); padding-bottom: 2px; }
  .cal .day {
    min-height: 48px; padding: 5px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--chip);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; line-height: 1;
  }
  .cal .day b { font-size: 15px; font-weight: 600; }
  .cal .day:disabled { background: none; border-color: transparent; color: var(--muted); opacity: .5; cursor: default; }
  .cal .day.out { opacity: .25; }
  .cal .day.today b { text-decoration: underline; text-underline-offset: 3px; }
  .cal .day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dots { display: flex; gap: 3px; height: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--k); }
  .day[aria-pressed="true"] .dot { box-shadow: 0 0 0 1.5px var(--accent-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .pill {
    display: inline-flex; align-items: flex-start; gap: 6px; max-width: 100%; padding: 4px 10px; border-radius: 999px;
    background: var(--k-soft); color: var(--k); font-size: 14px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere;
  }
  .pill svg { flex: none; width: 15px; height: 15px; margin-top: 2px; }
  .pill a { color: inherit; }
  .group { margin-top: 12px; padding: 10px; border-radius: 12px; background: var(--k-soft); border-left: 4px solid var(--k); }
  .group:first-child { margin-top: 0; }
  .group > .pill { padding: 0 2px; margin-bottom: 8px; background: none; }
  .group .opt { background: var(--card); }
  .group .opt[aria-pressed="true"] { background: var(--k); border-color: var(--k); color: var(--card); }
  .seg2 { grid-template-columns: 1fr 1fr; }
  .fhint { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 400; margin-top: 14px; }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  /* tabs */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-top: 14px; background: var(--chip); border: 1px solid var(--line); border-radius: 12px; }
  .tab { border: 0; background: none; border-radius: 9px; padding: 8px 6px; min-height: 42px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .tab svg { width: 16px; height: 16px; flex: none; }
  .tab[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* busy view */
  .now { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 10px; background: var(--chip); }
  .now svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
  .now b { display: block; font-size: 16px; line-height: 1.3; }
  .now span { font-size: 14px; }
  .now.busy { background: var(--busy-soft); color: var(--busy); }
  .now.open { background: var(--accent-soft); color: var(--accent); }
  .bnote { margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  .bday { padding: 12px 0 10px; border-top: 1px solid var(--line); }
  .bhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .bhead b { font-size: 15px; }
  .bhead span { color: var(--muted); font-size: 14px; }
  .tl { position: relative; height: 14px; border-radius: 7px; background: var(--chip); overflow: hidden; }
  /* timeline pieces: own class name (.seg is the duration/who-are-you button row) */
  .tseg { position: absolute; top: 0; bottom: 0; }
  .tseg.busy { background: var(--busy); }
  .tseg.open { background: var(--accent); opacity: .5; }
  .tseg.past { background: var(--card); opacity: .65; }
  .nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); }
  .axis { position: relative; height: 15px; margin-top: 3px; font-size: 11px; color: var(--muted); }
  .axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .axis span:first-child { transform: none; }
  .axis span:last-child { transform: translateX(-100%); }
  .blist { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px; }
  .blist li { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
  .blist li.past { opacity: .5; }
  .blist .none { color: var(--muted); }
  .dot.busy { background: var(--busy); }
  .dot.open { background: var(--accent); opacity: .7; }
  .dot.none { background: var(--chip); border: 1px solid var(--line); }
  .mini { margin-left: auto; border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 600; }
  .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0; }
  .summary { margin: 0 0 4px; font-weight: 600; }
  #details .where { margin: 6px 0 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=email], input[type=tel] {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
  }
  .count { float: right; font-weight: 400; color: var(--muted); font-size: 12px; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  .btn {
    display: block; width: 100%; margin-top: 18px; border: 0; border-radius: 10px; padding: 12px; min-height: 48px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700;
  }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .msg { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .msg.err { background: var(--danger-soft); color: var(--danger); }
  .msg.ok { background: var(--ok-soft); color: var(--ok); }
  .big { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
  dl { margin: 12px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .skeleton { height: 44px; border-radius: 10px; background: var(--chip); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } * { transition: none !important; } }
  footer { margin-top: 20px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="lab">PSquare Lab</p>
    <h1 id="title">Book a discussion</h1>
    <p class="sub">with Prof. Parikshit Pareek · Dept. of EE, IIT Roorkee</p>
  </header>
  <div id="app" aria-live="polite"></div>
  <footer>All times are India Standard Time (IST).</footer>
</main>

<script>
(() => {
  'use strict';

  // Backend base URL (the Vercel deployment of psquare-meet). Local dev uses the same origin.
  const API_BASE = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    ? location.origin
    : 'https://psquare-meet.vercel.app';

  const DURATIONS = [15, 30, 45, 60];
  const TZ = 'Asia/Kolkata';
  const app = document.getElementById('app');

  // Links look like …/meet/#P2ee1234 (key alone) or …/meet/#cancel=<token>.
  // The older …/meet/#k=<key> form still works.
  const rawHash = location.hash.slice(1);
  const params = new URLSearchParams(rawHash.includes('=') ? rawHash : '');
  const query = new URLSearchParams(location.search);
  let KEY = params.get('k') || (rawHash && !rawHash.includes('=') ? decodeURIComponent(rawHash) : '');
  let KIND = ''; // 'student' | 'guest', once known
  const CANCEL = params.get('cancel') || '';

  // --- helpers --------------------------------------------------------------

  const fmt = (opts) => new Intl.DateTimeFormat('en-IN', Object.assign({ timeZone: TZ }, opts));
  const fTime = fmt({ hour: 'numeric', minute: '2-digit', hour12: true });
  const fShortDay = fmt({ weekday: 'short', day: 'numeric', month: 'short' });
  const fMonth = fmt({ month: 'long', year: 'numeric' });
  const fLong = fmt({ weekday: 'long', day: 'numeric', month: 'long' });
  const norm = (s) => s.replace(/[  ]/g, ' ').replace(/\b(am|pm)\b/i, (m) => m.toUpperCase());
  const time = (iso) => norm(fTime.format(new Date(iso)));
  const dayDate = (key) => new Date(key + 'T12:00:00+05:30');
  // Calendar-date arithmetic on 'YYYY-MM-DD' keys (IST dates; no time zone involved).
  const addDays = (key, n) => new Date(Date.parse(key + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
  const weekdayIdx = (key) => (new Date(key + 'T00:00:00Z').getUTCDay() + 6) % 7; // Mon = 0
  const range = (start, end) => fLong.format(new Date(start)) + ', ' + time(start) + ' – ' + time(end) + ' IST';

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
    return el;
  }

  async function api(path, opts) {
    const headers = { 'Content-Type': 'application/json' };
    if (KEY) headers['X-Access-Key'] = KEY;
    let res;
    try {
      res = await fetch(API_BASE + path, Object.assign({ headers, cache: 'no-store' }, opts));
    } catch (e) {
      throw { message: 'Could not reach the booking server. Check your connection and try again.' };
    }
    let body = {};
    try { body = await res.json(); } catch (e) { /* ignore */ }
    if (!res.ok) throw { code: body.error, message: body.message || 'Something went wrong. Please try again.' };
    return body;
  }

  // How/where a slot's meeting happens (from the Open Slots event; API sends it per slot).
  function modeOf(iso) {
    for (const d of (state.data ? state.data.days : [])) {
      const i = d.slots.indexOf(iso);
      if (i >= 0) return (d.modes || [])[i] || '';
    }
    return '';
  }
  const needsPhone = (mode) => /whats\s*app|phone|mobile/i.test(mode || '');

  // Colour coding: call (green), online (blue), in person (amber).
  function modeKind(mode) {
    const m = mode || '';
    if (/whats\s*app|phone|mobile/i.test(m)) return 'call';
    if (/online|meet|zoom|teams|webex|skype|video|virtual|https?:\/\//i.test(m)) return 'online';
    if (/\bcall\b/i.test(m)) return 'call';
    return 'person';
  }
  const KIND_LABEL = { person: 'In person', online: 'Online', call: 'WhatsApp / phone' };
  const ICON = {
    call: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
    online: '<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
    person: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  };
  function icon(kind) {
    const span = document.createElement('span');
    span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[kind] + '</svg>';
    return span.firstChild;
  }
  // Text with https:// links made clickable (e.g. a Meet link in the mode).
  const linkify = (text) => text.split(/(https:\/\/[^\s·]+)/).filter(Boolean)
    .map((part) => /^https:\/\//.test(part) ? h('a', { href: part, target: '_blank', rel: 'noopener noreferrer' }, part) : part);
  const pill = (mode) => { const k = modeKind(mode); return h('span', { class: 'pill k-' + k }, icon(k), h('span', {}, linkify(mode))); };

  const msg = (kind, text) => h('p', { class: 'msg ' + kind, role: kind === 'err' ? 'alert' : 'status' }, text);

  // --- no key ---------------------------------------------------------------

  // Shown when the page is opened without a code (or with an old one):
  // visitors type the access code they were given, e.g. "Meet4821".
  function renderNoKey(note) {
    document.getElementById('title').textContent = 'Book a discussion';
    const input = h('input', {
      id: 'f-code', name: 'code', type: 'text', required: true, maxlength: 64,
      autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'Access code',
    });
    const status = h('div', {}, note ? msg('err', note) : null);
    const btn = h('button', { type: 'submit', class: 'btn' }, 'Continue');
    const form = h('form', {
      onsubmit: async (e) => {
        e.preventDefault();
        const code = input.value.replace(/\s+/g, '');
        if (!code) return;
        btn.disabled = true;
        btn.textContent = 'Checking…';
        status.replaceChildren();
        const prev = KEY;
        KEY = code;
        try {
          const res = await api('/api/access');
          KIND = res.kind;
          if (KIND === 'guest') draft.who = 'external';
          try { history.replaceState(null, '', location.pathname + location.search + '#' + encodeURIComponent(code)); } catch (err) { /* ignore */ }
          state.cache = {};
          state.data = null;
          busy.data = null;
          showView(state.view);
        } catch (err) {
          KEY = prev;
          btn.disabled = false;
          btn.textContent = 'Continue';
          status.replaceChildren(msg('err', err.code === 'BAD_LINK' ? 'That code didn’t work. Please check it and try again.' : err.message));
          input.focus();
        }
      },
    },
      h('label', { for: 'f-code' }, 'Access code'),
      input,
      h('p', { class: 'fhint' }, 'Prof. Pareek shares this code when you ask for a meeting. Students in the lab can use their usual link.'),
      btn,
      status);
    app.replaceChildren(h('section', { class: 'card' },
      h('p', { class: 'big' }, 'Enter your access code'),
      h('p', { class: 'hint' }, 'Booking a meeting with Prof. Parikshit Pareek (Dept. of EE, IIT Roorkee) needs a short access code.'),
      form));
    setTimeout(() => input.focus(), 50);
  }

  // --- booking flow ---------------------------------------------------------

  const state = {
    view: query.has('busy') ? 'busy' : 'book',
    duration: 30, data: null, loading: false, error: '', day: null, start: null, cache: {},
  };

  // --- tabs -------------------------------------------------------------------

  const TITLES = { book: 'Book a discussion', busy: 'When I’m busy' };
  function showView(v) {
    state.view = v;
    document.getElementById('title').textContent = TITLES[v];
    try { history.replaceState(null, '', location.pathname + (v === 'busy' ? '?busy' : '') + location.hash); } catch (e) { /* ignore */ }
    if (v === 'busy') loadBusy();
    else if (state.data || state.loading) renderBook();
    else loadSlots();
  }
  function tabsView() {
    return h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'View' },
      [['book', 'Book a slot', 'cal'], ['busy', 'When I’m busy', 'clock']].map(([v, label, ic]) => h('button', {
        type: 'button', class: 'tab', role: 'tab', 'aria-selected': String(state.view === v),
        onclick: () => { if (state.view !== v) showView(v); },
      }, icon(ic), label)));
  }

  async function loadSlots(force) {
    const d = state.duration;
    state.error = '';
    if (!force && state.cache[d]) {
      state.data = state.cache[d];
    } else {
      state.loading = true;
      state.data = null;
      renderBook();
      try {
        state.cache[d] = await api('/api/slots?duration=' + d);
        if (d !== state.duration) return; // user switched meanwhile
        state.data = state.cache[d];
      } catch (e) {
        state.error = e.message;
        if (e.code === 'BAD_LINK') return renderNoKey(KEY ? 'That link or code is no longer valid. Please enter the current code.' : '');
      } finally {
        state.loading = false;
      }
    }
    const days = state.data ? state.data.days : [];
    if (!days.some((x) => x.date === state.day && x.slots.length)) {
      const first = days.find((x) => x.slots.length);
      state.day = first ? first.date : null;
    }
    if (state.start && !(days.find((x) => x.date === state.day) || { slots: [] }).slots.includes(state.start)) {
      state.start = null;
    }
    renderBook();
  }

  function renderBook() {
    const old = app.querySelector('#details form');
    if (old) Object.assign(draft, Object.fromEntries(new FormData(old)));
    const card = h('section', { class: 'card' },
      h('p', { class: 'rules' },
        'One booking at a time, and at most one per week (Mon–Sun). ',
        h('br'),
        'An agenda is required. No drop-ins: please book a slot.'),

      h('h2', {}, h('span', { class: 'n' }, '1'), 'How long do you need?'),
      h('div', { class: 'seg', role: 'group', 'aria-label': 'Duration' },
        DURATIONS.map((d) => h('button', {
          type: 'button', class: 'opt', 'aria-pressed': String(d === state.duration),
          onclick: () => { if (d !== state.duration) { state.duration = d; state.start = null; loadSlots(); } },
        }, d + ' min'))),

      h('h2', {}, h('span', { class: 'n' }, '2'), 'Pick a day'),
      daysView(),

      h('h2', {}, h('span', { class: 'n' }, '3'), 'Pick a start time ',
        h('small', {}, (state.day && state.data ? fShortDay.format(dayDate(state.day)) + ' · ' : '') + 'IST')),
      timesView(),
      state.error ? msg('err', state.error) : null,
    );
    if (state.view !== 'book') return;
    app.replaceChildren(...[tabsView(), card, state.start ? formView() : null].filter(Boolean));
  }

  function daysView() {
    if (state.loading || !state.data) {
      if (!state.loading && state.error) return h('p', { class: 'hint' }, 'Days will appear here.');
      return h('div', { class: 'cal' }, Array.from({ length: 14 }, () => h('div', { class: 'skeleton', style: 'height:48px' })));
    }
    const days = state.data.days;
    const byDate = new Map(days.map((d) => [d.date, d]));
    const first = days[0].date;
    const last = days[days.length - 1].date;
    // Whole Mon–Sun weeks covering the window, minus leading/trailing weeks with nothing free.
    const weeks = [];
    for (let w = addDays(first, -weekdayIdx(first)); w <= last; w = addDays(w, 7)) weeks.push(w);
    const hasFree = (w) => [0, 1, 2, 3, 4, 5, 6].some((i) => (byDate.get(addDays(w, i)) || { slots: [] }).slots.length);
    while (weeks.length > 1 && !hasFree(weeks[0])) weeks.shift();
    while (weeks.length > 1 && !hasFree(weeks[weeks.length - 1])) weeks.pop();
    const cells = [];
    for (let k = weeks[0]; k <= addDays(weeks[weeks.length - 1], 6); k = addDays(k, 1)) {
      const d = byDate.get(k);
      const n = d ? d.slots.length : 0;
      const kinds = d ? [...new Set((d.modes || []).map(modeKind))] : [];
      cells.push(h('button', {
        type: 'button', class: 'day' + (d ? '' : ' out') + (k === first ? ' today' : ''), disabled: n === 0,
        'aria-pressed': String(k === state.day),
        'aria-label': fLong.format(dayDate(k)) + (n ? ', ' + n + ' times free' : ', no free times'),
        onclick: () => { state.day = k; state.start = null; renderBook(); },
      }, h('b', {}, String(Number(k.slice(8)))), h('span', { class: 'dots' }, kinds.map((kd) => h('i', { class: 'dot k-' + kd })))));
    }
    const m1 = fMonth.format(dayDate(weeks[0] < first ? first : weeks[0]));
    const m2 = fMonth.format(dayDate(addDays(weeks[weeks.length - 1], 6) > last ? last : addDays(weeks[weeks.length - 1], 6)));
    const kindsAll = ['person', 'online', 'call'].filter((kd) => days.some((d) => (d.modes || []).some((m) => modeKind(m) === kd)));
    return h('div', {},
      h('p', { class: 'calhead' }, m1 === m2 ? m1 : m1.replace(/ \d{4}$/, '') + ' – ' + m2),
      h('div', { class: 'cal', role: 'group', 'aria-label': 'Day' },
        ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((w) => h('span', { class: 'wd', 'aria-hidden': 'true' }, w)),
        cells),
      kindsAll.length ? h('p', { class: 'legend' },
        kindsAll.map((kd) => h('span', {}, h('i', { class: 'dot k-' + kd }), KIND_LABEL[kd]))) : null);
  }

  function timesView() {
    if (state.loading) return h('div', { class: 'times' }, [0, 1, 2, 3, 4, 5].map(() => h('div', { class: 'skeleton' })));
    if (!state.data) return h('p', { class: 'hint' }, '');
    const day = state.data.days.find((d) => d.date === state.day);
    if (!day) {
      return h('p', { class: 'hint' },
        'No free times in the next ' + (state.data.days.length - 1) + ' days for ' + state.duration + ' minutes. Try a shorter duration, or check back later.');
    }
    // Group the day's times by meeting mode (e.g. WhatsApp call / Online / Office).
    const groups = [];
    day.slots.forEach((iso, i) => {
      const mode = (day.modes || [])[i] || '';
      let g = groups.find((x) => x.mode === mode);
      if (!g) groups.push((g = { mode, slots: [] }));
      g.slots.push(iso);
    });
    return h('div', {}, groups.map((g) => h('div', { class: 'group k-' + modeKind(g.mode) },
      g.mode ? pill(g.mode) : null,
      h('div', { class: 'times', role: 'group', 'aria-label': 'Start time' + (g.mode ? ', ' + g.mode : '') },
        g.slots.map((iso) => h('button', {
          type: 'button', class: 'opt', 'aria-pressed': String(iso === state.start),
          onclick: () => {
            state.start = iso;
            renderBook();
            const f = document.getElementById('details');
            if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
          },
        }, time(iso)))))));
  }

  // Form values: name/email/enrollment remembered on this device ONLY if the
  // person ticks "Remember me" (never the phone number), plus whatever was
  // typed before they changed the time.
  const STORE = 'psq-meet-details';
  const draft = (() => {
    try {
      const d = JSON.parse(localStorage.getItem(STORE) || '{}');
      if (!d.remember) { localStorage.removeItem(STORE); return {}; } // older saves without consent
      if ('phone' in d) { delete d.phone; localStorage.setItem(STORE, JSON.stringify(d)); }
      return d;
    } catch (e) { return {}; }
  })();

  function field(label, name, attrs) {
    const input = h('input', Object.assign({ id: 'f-' + name, name, required: true, value: draft[name] || '' }, attrs));
    return [h('label', { for: 'f-' + name }, label), input];
  }

  function formView() {
    const end = new Date(new Date(state.start).getTime() + state.duration * 60000).toISOString();
    const mode = modeOf(state.start);
    const external = KIND === 'guest' || draft.who === 'external';
    const agendaCount = h('span', { class: 'count' }, (draft.agenda || '').length + '/200');
    const agenda = h('input', {
      id: 'f-agenda', name: 'agenda', type: 'text', required: true, maxlength: 200, minlength: 3, value: draft.agenda || '',
      placeholder: external ? 'e.g. Discuss a possible collaboration on grid optimisation' : 'e.g. Discuss BTP progress and next steps',
      autocomplete: 'off',
      oninput: (e) => { agendaCount.textContent = e.target.value.length + '/200'; },
    });
    const status = h('div');
    const submit = h('button', { type: 'submit', class: 'btn' }, 'Confirm booking');

    const form = h('form', {
      novalidate: false,
      onsubmit: async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        try {
          if (data.remember) {
            localStorage.setItem(STORE, JSON.stringify({
              remember: true, who: draft.who || 'iitr', name: data.name, email: data.email,
              enrollment: data.enrollment || draft.enrollment || '', affiliation: data.affiliation || draft.affiliation || '',
            }));
          } else {
            localStorage.removeItem(STORE);
          }
        } catch (err) { /* private mode */ }
        submit.disabled = true;
        submit.textContent = 'Booking…';
        status.replaceChildren();
        try {
          const res = await api('/api/book', {
            method: 'POST',
            body: JSON.stringify(Object.assign({}, data, {
              start: state.start, duration: state.duration, external,
              enrollment: external ? data.affiliation : data.enrollment, affiliation: undefined, remember: undefined,
            })),
          });
          renderDone(res.booking, data);
        } catch (err) {
          submit.disabled = false;
          submit.textContent = 'Confirm booking';
          status.replaceChildren(msg('err', err.message));
          if (err.code === 'SLOT_TAKEN') {
            state.cache = {};
            state.error = err.message;
            await loadSlots(true);
          }
        }
      },
    },
      KIND === 'guest' ? null : [
        h('label', {}, 'You are'),
        h('div', { class: 'seg seg2', role: 'group', 'aria-label': 'You are' },
          [['iitr', 'At IIT Roorkee'], ['external', 'From outside IITR']].map(([v, label]) => h('button', {
            type: 'button', class: 'opt', 'aria-pressed': String((draft.who || 'iitr') === v),
            onclick: () => { if ((draft.who || 'iitr') !== v) { Object.assign(draft, Object.fromEntries(new FormData(form))); draft.who = v; renderBook(); } },
          }, label))),
      ],
      field('Name', 'name', { type: 'text', autocomplete: 'name', maxlength: 80, minlength: 2 }),
      field('Email', 'email', { type: 'email', autocomplete: 'email', maxlength: 254, inputmode: 'email', autocapitalize: 'off', spellcheck: 'false', placeholder: external ? 'you@institute.edu' : 'name@iitr.ac.in' }),
      external ? null : h('p', { class: 'fhint' }, 'Use your IIT Roorkee email (ending in iitr.ac.in).'),
      needsPhone(mode)
        ? field('WhatsApp number', 'phone', { type: 'tel', autocomplete: 'tel', inputmode: 'tel', maxlength: 20, placeholder: '+91 98765 43210', title: 'Phone number with country code' })
        : null,
      external ? h('p', { class: 'fhint' }, 'Your institute or work email works best.') : null,
      external
        ? [
            field('Institute / organisation and your role', 'affiliation', { type: 'text', maxlength: 100, minlength: 3, autocomplete: 'organization', placeholder: 'e.g. PhD student, IIT Delhi' }),
            h('p', { class: 'fhint' }, 'Examples: “Postdoc, NTU Singapore” · “Engineer, Tata Power” · “Assistant Professor, NIT Trichy” · “Final-year B.Tech, DTU”'),
          ]
        : field('Enrollment / employee number', 'enrollment', { type: 'text', maxlength: 20, autocapitalize: 'characters', autocomplete: 'off', placeholder: 'e.g. 23116045', title: 'Letters and digits only' }),
      h('label', { for: 'f-agenda' }, 'Agenda (one line) ', agendaCount),
      agenda,
      h('div', { class: 'hp', 'aria-hidden': 'true' },
        h('label', { for: 'f-website' }, 'Website'),
        h('input', { id: 'f-website', name: 'website', type: 'text', tabindex: '-1', autocomplete: 'off' })),
      h('label', { class: 'check' },
        h('input', { type: 'checkbox', name: 'remember', value: '1', checked: !!draft.remember }),
        'Remember my name and email on this device'),
      submit,
      h('p', { class: 'fhint' }, 'Your details are used only to arrange this meeting and are deleted about 6 months after it.'),
      status,
    );

    return h('section', { class: 'card', id: 'details' },
      h('h2', {}, h('span', { class: 'n' }, '4'), 'Your details'),
      h('p', { class: 'summary' }, range(state.start, end) + ' · ' + state.duration + ' min'),
      mode ? h('p', { class: 'where' }, pill(mode)) : null,
      form);
  }

  function renderDone(b, data) {
    document.getElementById('title').textContent = 'You’re booked';
    app.replaceChildren(
      h('section', { class: 'card' },
        h('p', { class: 'big' }, 'Booking confirmed'),
        h('dl', {},
          h('dt', {}, 'When'), h('dd', {}, range(b.start, b.end)),
          h('dt', {}, 'Length'), h('dd', {}, b.durationMin + ' min'),
          h('dt', {}, 'Where'), h('dd', {}, b.location ? pill(b.location) : ''),
          h('dt', {}, 'Agenda'), h('dd', {}, data.agenda)),
        b.emailSent
          ? msg('ok', 'A confirmation email with a calendar file and a cancel link is on its way to ' + data.email + '. Check spam if it hasn’t arrived in a few minutes.')
          : msg('ok', 'Your booking is saved. The confirmation email (with the cancel link) is delayed and should arrive within about 10 minutes.'),
        h('p', { class: 'hint', style: 'margin-top:12px' }, 'If you can’t come, please cancel using the link in that email so someone else can use the slot.'))
    );
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // --- "When I'm busy" view ---------------------------------------------------

  const busy = { data: null, at: 0, loading: false, error: '' };
  const DAY0 = 8 * 60, DAY1 = 20 * 60; // timeline shows 8 AM – 8 PM IST
  const minutesIST = (iso, dateKey) => (Date.parse(iso) - Date.parse(dateKey + 'T00:00:00+05:30')) / 60000;
  const pct = (m) => ((Math.min(Math.max(m, DAY0), DAY1) - DAY0) / (DAY1 - DAY0)) * 100;
  const fDayName = fmt({ weekday: 'long' });
  const fDateShort = fmt({ day: 'numeric', month: 'short' });
  const endTime = (iso, dateKey) => (minutesIST(iso, dateKey) >= 1440 ? 'midnight' : time(iso));

  async function loadBusy(force) {
    if (!force && busy.data && Date.now() - busy.at < 60000) return renderBusy();
    busy.loading = true;
    renderBusy();
    try {
      busy.data = await api('/api/busy');
      busy.at = Date.now();
      busy.error = '';
    } catch (e) {
      busy.error = e.message;
      if (e.code === 'BAD_LINK') return renderNoKey(KEY ? 'That link or code is no longer valid. Please enter the current code.' : '');
    } finally {
      busy.loading = false;
    }
    renderBusy();
  }

  function nowBanner(today) {
    const now = Date.now();
    const at = (list) => list.find(([s, e]) => Date.parse(s) <= now && now < Date.parse(e));
    const next = today.busy.find(([s]) => Date.parse(s) > now);
    let kind = 'free', head, sub;
    const b = !today.allDayBusy && at(today.busy);
    const o = !today.allDayBusy && at(today.open);
    if (today.allDayBusy) { kind = 'busy'; head = 'Busy all day today'; sub = 'Please don’t drop by today. You can still book a slot for another day.'; }
    else if (b) { kind = 'busy'; head = 'Busy right now'; sub = 'Until ' + endTime(b[1], today.date) + '. Please don’t drop by.'; }
    else if (o) { kind = 'open'; head = 'In a meeting block right now'; sub = 'Until ' + time(o[1]) + '. Online booking needs 2 h notice.'; }
    else { head = 'No fixed commitment right now'; sub = next ? 'Next busy at ' + time(next[0]) + '.' : 'Nothing else marked busy today.'; }
    return h('div', { class: 'now ' + kind, role: 'status' }, icon('clock'), h('div', {}, h('b', {}, head), h('span', {}, sub)));
  }

  function dayRow(d, i) {
    const now = Date.now();
    const isToday = i === 0;
    const segs = [];
    if (d.allDayBusy) segs.push(h('i', { class: 'tseg busy', style: 'left:0;width:100%' }));
    else {
      for (const [cls, list] of [['open', d.open], ['busy', d.busy]]) {
        for (const [s, e] of list) {
          const a = pct(minutesIST(s, d.date)), b = pct(minutesIST(e, d.date));
          if (b > a) segs.push(h('i', { class: 'tseg ' + cls, style: 'left:' + a + '%;width:' + (b - a) + '%' }));
        }
      }
    }
    if (isToday) {
      const nowPct = pct((now - Date.parse(d.date + 'T00:00:00+05:30')) / 60000);
      if (nowPct > 0) segs.push(h('i', { class: 'tseg past', style: 'left:0;width:' + nowPct + '%' }));
      if (nowPct > 0 && nowPct < 100) segs.push(h('i', { class: 'nowline', style: 'left:calc(' + nowPct + '% - 1px)' }));
    }

    const items = d.allDayBusy
      ? [h('li', {}, h('i', { class: 'dot busy' }), h('b', {}, 'Busy all day'))]
      : [
          ...d.busy.map(([s, e]) => ({ s, e, kind: 'busy' })),
          ...d.open.map(([s, e]) => ({ s, e, kind: 'open' })),
        ].sort((x, y) => Date.parse(x.s) - Date.parse(y.s)).map((it) => h('li', { class: Date.parse(it.e) <= now ? 'past' : null },
          h('i', { class: 'dot ' + it.kind }),
          h('span', {}, (it.kind === 'busy' ? 'Busy · ' : 'Open for booking · ') + time(it.s) + ' – ' + endTime(it.e, d.date)),
          it.kind === 'open' && Date.parse(it.e) > now + 2 * 3600e3
            ? h('button', { type: 'button', class: 'mini', onclick: () => { state.day = d.date; state.start = null; showView('book'); } }, 'Book')
            : null));
    return h('div', { class: 'bday' },
      h('div', { class: 'bhead' },
        h('b', {}, i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : fDayName.format(dayDate(d.date))),
        h('span', {}, fDateShort.format(dayDate(d.date)))),
      h('div', { class: 'tl', 'aria-hidden': 'true' }, segs),
      h('div', { class: 'axis', 'aria-hidden': 'true' }, ['8 AM', '11', '2 PM', '5', '8 PM'].map((t, k) => h('span', { style: 'left:' + k * 25 + '%' }, t))),
      h('ul', { class: 'blist' }, items.length ? items : h('li', { class: 'none' }, h('i', { class: 'dot none' }), 'No fixed commitments')));
  }

  function renderBusy() {
    if (state.view !== 'busy') return;
    document.getElementById('title').textContent = TITLES.busy;
    let body;
    if (busy.loading && !busy.data) body = [h('div', { class: 'skeleton', style: 'height:64px' }), h('div', { class: 'skeleton', style: 'height:120px;margin-top:12px' })];
    else if (!busy.data) body = msg('err', busy.error || 'Could not load.');
    else body = [
      nowBanner(busy.data.days[0]),
      h('p', { class: 'bnote' }, 'Busy = classes, meetings or travel. Times not marked busy are not a promise that I’m in my office: for a guaranteed meeting, book a slot.'),
      h('p', { class: 'legend' },
        h('span', {}, h('i', { class: 'dot busy' }), 'Busy'),
        h('span', {}, h('i', { class: 'dot open' }), 'Open for booking'),
        h('span', {}, h('i', { class: 'dot none' }), 'No fixed commitment')),
      busy.data.days.map(dayRow),
    ];
    app.replaceChildren(tabsView(), h('section', { class: 'card' }, body));
  }

  // Keep the busy view (and its "right now" banner) current while it is open.
  setInterval(() => {
    if (state.view !== 'busy' || document.visibilityState !== 'visible') return;
    if (Date.now() - busy.at > 5 * 60000) loadBusy(true);
    else renderBusy();
  }, 60000);

  // --- cancel flow ----------------------------------------------------------

  async function renderCancel() {
    document.getElementById('title').textContent = 'Cancel a booking';
    app.replaceChildren(h('section', { class: 'card' }, h('div', { class: 'skeleton' })));
    let b;
    try {
      b = (await api('/api/cancel', { method: 'POST', body: JSON.stringify({ token: CANCEL, action: 'lookup' }) })).booking;
    } catch (e) {
      return app.replaceChildren(h('section', { class: 'card' }, msg('err', e.message)));
    }
    const status = h('div');
    const details = h('dl', {},
      h('dt', {}, 'When'), h('dd', {}, range(b.start, b.end)),
      h('dt', {}, 'Length'), h('dd', {}, b.durationMin + ' min'),
      b.location ? [h('dt', {}, 'Where'), h('dd', {}, pill(b.location))] : null);

    if (!b.cancellable) {
      const text = {
        cancelled_student: 'This booking is already cancelled.',
        cancelled_host: 'This booking was cancelled by Prof. Pareek. Check your email for a link to rebook.',
        completed: 'This booking has already taken place.',
        active: 'This booking has already started, so it can no longer be cancelled online.',
      }[b.status];
      return app.replaceChildren(h('section', { class: 'card' }, h('p', { class: 'big' }, 'Your booking'), details, msg('ok', text)));
    }

    const btn = h('button', {
      type: 'button', class: 'btn danger',
      onclick: async () => {
        btn.disabled = true;
        btn.textContent = 'Cancelling…';
        try {
          await api('/api/cancel', { method: 'POST', body: JSON.stringify({ token: CANCEL, action: 'cancel' }) });
          btn.remove();
          status.replaceChildren(msg('ok', 'Cancelled. The slot is free again, and a confirmation email is on its way.'));
        } catch (e) {
          btn.disabled = false;
          btn.textContent = 'Cancel this booking';
          status.replaceChildren(msg('err', e.message));
        }
      },
    }, 'Cancel this booking');

    app.replaceChildren(h('section', { class: 'card' },
      h('p', { class: 'big' }, 'Your booking'), details, btn, status));
  }

  // --- start ----------------------------------------------------------------

  // A link that differs only after "#" does not reload the page by itself.
  window.addEventListener('hashchange', () => location.reload());

  if (CANCEL) renderCancel();
  else if (!KEY) renderNoKey();
  else {
    showView(state.view);
    // Learn whether this is the students' link or the guest code (guests always book as outsiders).
    api('/api/access').then((r) => {
      KIND = r.kind;
      if (KIND === 'guest') { draft.who = 'external'; if (state.view === 'book' && state.start) renderBook(); }
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
